[package]
name = "black-edge-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "black-edge-core"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio                = { version = "1",    features = ["full"] }
tokio-tungstenite    = { version = "0.21", features = ["native-tls"] }
futures-util         = "0.3"

# Web framework + CORS
axum                 = "0.7"
tower                = "0.4"
tower-http           = { version = "0.5", features = ["cors"] }

# High-speed HTTP client with connection pooling for <15ms order round-trip
reqwest              = { version = "0.12", features = ["json", "native-tls"] }

# Serialization
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"

# ── Cryptography (EIP-712 / ECDSA – implemented from first principles) ───────
# Using primitive crates avoids version-matrix friction from alloy/ethers while
# producing identical output: keccak256 hashing + secp256k1 ECDSA signing.
k256                 = { version = "0.13", features = ["ecdsa"] }
sha3                 = "0.10"
hmac                 = "0.12"
sha2                 = "0.10"
hex                  = "0.4"
base64               = "0.22"

# Utilities
uuid                 = { version = "1", features = ["v4"] }
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter"] }
anyhow               = "1"
rand                 = "0.8"
dotenv               = "0.15"
chrono               = { version = "0.4", features = ["serde"] }

# jemalloc: prevents memory fragmentation under high-velocity WS ingestion
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator    = "0.5"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
