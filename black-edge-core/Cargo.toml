[package]
name = "black-edge-core"
version = "0.1.0"
edition = "2021"
description = "Sub-millisecond HFT execution engine for Polymarket BTC binary options"
authors = ["Black Edge Core"]

[[bin]]
name = "black-edge-core"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket client (Binance + Polymarket)
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# HTTP server (local metrics/credentials API)
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors"] }

# HTTP client (Polymarket REST)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# EIP-712 / Ethereum signing (Polymarket L2 execution)
# ethers v2: `rustls` TLS backend; LocalWallet + Signer are included by default
ethers = { version = "2", features = ["rustls"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Crypto / encoding helpers
hex = "0.4"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
